[project]
name = "icr-lab"
version = "0.1.0"
description = "An interactive lab for exploring Intent Compression Ratio and token economics in AI systems"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.47.0",
    "httpx>=0.28.1",
]

[project.scripts]
icr-lab = "app._cli:main"
icr-api = "app._cli:run_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "simulations", "metrics", "visuals", "examples"]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "uvicorn>=0.47.0",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/kameshsampath/icr-lab"
