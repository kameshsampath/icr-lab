[project]
name = "icr-lab"
version = "0.2.0"
description = "An interactive lab for exploring Intent Compression Ratio and token economics in AI systems"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
cortex = [
    "snowflake-snowpark-python>=1.11.0",
    "snowflake-ml-python>=1.5.0",
]
lmstudio = []  # No extra deps — uses stdlib urllib
all = [
    "icr-lab[cortex]",
]

[project.scripts]
icr-lab = "app._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backends", "simulations", "metrics", "visuals", "examples"]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/kameshsampath/icr-lab"
